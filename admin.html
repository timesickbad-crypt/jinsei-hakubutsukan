<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理画面 — 人生博物館</title>
<link href="./admin_files/css2" rel="stylesheet">
<style>
:root{
  --bg:#08080f;--card:#111118;--border:rgba(201,168,76,.15);
  --gold:#c9a84c;--gold2:#e8c97a;--gold3:#8b6914;
  --text:#e8e2d8;--muted:#6a6480;--dim:#2a2838;
  --fail:#b87333;--unfinish:#4a7fa5;--success:#4a9a6a;
  --serif:'Noto Serif JP',serif;--display:'Cinzel',serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--serif);font-weight:300;min-height:100vh;}
header{background:rgba(8,8,15,.98);border-bottom:1px solid var(--border);padding:0 20px;position:sticky;top:0;z-index:100;}
.hd-inner{display:flex;align-items:center;justify-content:space-between;height:52px;max-width:720px;margin:0 auto;}
.hd-title{font-family:var(--display);font-size:11px;letter-spacing:.4em;color:var(--gold);}
.hd-back{font-size:10px;color:var(--muted);text-decoration:none;border:1px solid var(--border);padding:4px 10px;border-radius:1px;letter-spacing:.1em;transition:.2s;}
.hd-back:hover{color:var(--gold);border-color:rgba(201,168,76,.3);}
.tabs{display:flex;border-bottom:1px solid var(--border);background:rgba(8,8,15,.95);position:sticky;top:52px;z-index:90;overflow-x:auto;scrollbar-width:none;}
.tab{flex-shrink:0;padding:12px 16px;font-family:var(--serif);font-size:10px;letter-spacing:.2em;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:.2s;margin-bottom:-1px;white-space:nowrap;}
.tab.active{color:var(--gold2);border-bottom-color:var(--gold);}
.panel{display:none;padding:20px 16px 80px;max-width:720px;margin:0 auto;}
.panel.active{display:block;}
.sec-title{font-family:var(--display);font-size:9px;letter-spacing:.4em;color:var(--gold);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.form-grp{margin-bottom:16px;}
label,.form-lbl{display:block;font-family:var(--display);font-size:8px;letter-spacing:.3em;color:rgba(201,168,76,.6);margin-bottom:6px;}
input[type=text],input[type=datetime-local],textarea,select{
  width:100%;background:#0a0a14;border:1px solid var(--border);color:var(--text);
  font-family:var(--serif);font-size:13px;padding:10px 12px;outline:none;
  transition:.2s;border-radius:1px;-webkit-appearance:none;
}
input:focus,textarea:focus,select:focus{border-color:rgba(201,168,76,.4);}
textarea{resize:vertical;min-height:70px;line-height:1.8;}
select option{background:#111;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn-primary{width:100%;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-family:var(--display);font-size:10px;letter-spacing:.3em;padding:12px;cursor:pointer;transition:.2s;border-radius:1px;}
.btn-primary:hover{background:rgba(201,168,76,.14);}
.btn-sm{background:none;border:1px solid var(--border);color:var(--muted);font-size:10px;padding:4px 10px;cursor:pointer;border-radius:1px;font-family:var(--serif);letter-spacing:.05em;transition:.2s;}
.btn-sm:hover{border-color:var(--gold);color:var(--gold);}
.btn-danger{border-color:rgba(192,57,43,.4);color:#e05a4a;}
.btn-danger:hover{border-color:rgba(192,57,43,.8);}
.btn-fail{border-color:rgba(184,115,51,.4);color:var(--fail);}
.btn-unfinish{border-color:rgba(74,127,165,.4);color:var(--unfinish);}
.btn-success{border-color:rgba(74,154,106,.4);color:var(--success);}

/* IMG UPLOAD */
.img-zone{border:1px dashed rgba(201,168,76,.2);padding:16px;text-align:center;border-radius:1px;}
.img-zone-btn{display:inline-block;padding:7px 16px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);color:var(--gold);font-size:11px;letter-spacing:.1em;cursor:pointer;border-radius:1px;}
.img-prev{max-width:100%;max-height:120px;object-fit:contain;margin-top:8px;border:1px solid var(--border);display:none;}

/* WORK LIST */
.work-list{display:flex;flex-direction:column;gap:8px;}
.work-item{background:var(--card);border:1px solid var(--border);border-radius:2px;padding:12px 14px;}
.work-item-hd{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
.work-item-no{font-family:var(--display);font-size:9px;color:var(--muted);white-space:nowrap;}
.work-item-title{font-size:13px;flex:1;}
.work-item-meta{font-size:10px;color:var(--muted);margin-bottom:6px;}
.floor-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;}
.fd-fail{background:var(--fail);}
.fd-unfinish{background:var(--unfinish);}
.fd-success{background:var(--success);}
.work-actions{display:flex;flex-wrap:wrap;gap:6px;}
.work-img-thumb{width:40px;height:40px;object-fit:cover;border:1px solid var(--border);flex-shrink:0;}
.status-badge{display:inline-block;font-size:9px;letter-spacing:.1em;padding:2px 7px;border-radius:1px;margin-bottom:6px;}
.sb-pending{background:rgba(255,200,50,.08);border:1px solid rgba(255,200,50,.2);color:#f0c040;}
.sb-exhibited{background:rgba(74,154,106,.08);border:1px solid rgba(74,154,106,.2);color:var(--success);}
.sb-rejected{background:rgba(192,57,43,.08);border:1px solid rgba(192,57,43,.2);color:#e05a4a;}

/* MIGRATION MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;align-items:center;justify-content:center;padding:20px;}
.overlay.show{display:flex;}
.modal-box{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:24px;width:100%;max-width:380px;}
.modal-box-title{font-family:var(--display);font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.mig-opts{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
.mig-opt{padding:12px;border:1px solid var(--border);border-radius:1px;cursor:pointer;background:none;font-family:var(--serif);font-size:12px;color:var(--text);width:100%;text-align:left;transition:.2s;letter-spacing:.05em;}
.mig-opt:hover{border-color:var(--gold);background:rgba(201,168,76,.05);}
.modal-close{width:100%;margin-top:10px;padding:10px;background:none;border:1px solid var(--border);color:var(--muted);font-family:var(--serif);font-size:11px;cursor:pointer;border-radius:1px;transition:.2s;}
.modal-close:hover{color:var(--gold);border-color:rgba(201,168,76,.3);}

/* CERT PREVIEW */
.cert-preview{background:#f5f0e8;border:1px solid var(--border);border-radius:2px;padding:24px;margin-top:14px;font-family:'Georgia',serif;color:#1a1208;}
.cert-logo{text-align:center;font-size:11px;letter-spacing:.3em;color:#8b6914;margin-bottom:4px;}
.cert-headline{text-align:center;font-size:20px;letter-spacing:.15em;color:#1a1208;margin-bottom:3px;}
.cert-sub{text-align:center;font-size:9px;letter-spacing:.2em;color:#8b6914;margin-bottom:16px;}
.cert-divider{border:none;border-top:1px solid rgba(139,105,20,.3);margin:12px 0;}
.cert-row{display:flex;justify-content:space-between;margin-bottom:8px;font-size:11px;}
.cert-key{color:#8b6914;letter-spacing:.1em;font-size:10px;}
.cert-val{color:#1a1208;font-weight:bold;}
.cert-comment{background:rgba(139,105,20,.06);border:1px solid rgba(139,105,20,.2);padding:10px;font-size:11px;line-height:1.8;color:#2a1a08;margin:12px 0;font-style:italic;}
.cert-seal{text-align:right;font-size:10px;color:#8b6914;margin-top:12px;}
.cert-qr{text-align:center;margin-top:12px;font-size:9px;color:#8b6914;}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:2px;padding:14px;text-align:center;}
.stat-n{font-family:var(--display);font-size:22px;color:var(--gold2);}
.stat-l{font-size:9px;letter-spacing:.2em;color:var(--muted);margin-top:3px;}
.floor-stats-bar{display:flex;gap:8px;margin-bottom:14px;}
.fsb{flex:1;padding:10px;border-radius:1px;text-align:center;font-size:11px;cursor:pointer;border:none;background:rgba(201,168,76,.05);border-bottom:2px solid;}
.fsb.fail-bar{border-bottom-color:var(--fail);color:var(--fail);}
.fsb.unfinish-bar{border-bottom-color:var(--unfinish);color:var(--unfinish);}
.fsb.success-bar{border-bottom-color:var(--success);color:var(--success);}

/* SPECIAL WORKS CHECKBOX */
.special-works-check{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto;background:#0a0a14;border:1px solid var(--border);padding:10px;border-radius:1px;}
.swc-item{display:flex;align-items:center;gap:8px;font-size:12px;}
.swc-item input{width:16px;height:16px;accent-color:var(--gold);}
.sub-note{font-size:10px;color:var(--muted);margin-top:4px;}

/* SUBMISSIONS */
.sub-item{background:var(--card);border:1px solid var(--border);border-radius:2px;padding:14px;margin-bottom:8px;}
.sub-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;}
.sub-title{font-size:14px;flex:1;}
.sub-body{font-size:11px;color:var(--muted);line-height:1.8;margin-bottom:10px;}
.sub-actions{display:flex;flex-wrap:wrap;gap:6px;}
</style>
</head>

<!-- パスワード認証オーバーレイ -->
<div id="pw-overlay" style="position:fixed;inset:0;background:#08080f;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;">
  <div style="text-align:center;margin-bottom:32px;">
    <div style="font-family:&#39;Cinzel&#39;,serif;font-size:11px;letter-spacing:.4em;color:#c9a84c;margin-bottom:8px;">MUSEUM OF HUMAN LIFE</div>
    <div style="font-family:&#39;Cinzel&#39;,serif;font-size:18px;letter-spacing:.2em;color:#c9a84c;">管理画面</div>
    <div style="font-size:11px;color:#6a6480;margin-top:6px;letter-spacing:.1em;">館長・学芸員専用</div>
  </div>
  <div style="width:100%;max-width:300px;">
    <input type="password" id="pw-input" placeholder="パスワードを入力" style="width:100%;background:#111118;border:1px solid rgba(201,168,76,.2);color:#e8e2d8;font-size:14px;padding:12px 16px;outline:none;border-radius:1px;text-align:center;letter-spacing:.2em;font-family:&#39;Noto Serif JP&#39;,serif;" onkeydown="if(event.key===&#39;Enter&#39;)checkPw()">
    <div id="pw-error" style="color:#e05a4a;font-size:11px;text-align:center;margin-top:8px;display:none;">パスワードが違います</div>
    <button onclick="checkPw()" style="width:100%;margin-top:12px;padding:12px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.3);color:#c9a84c;font-family:&#39;Cinzel&#39;,serif;font-size:10px;letter-spacing:.3em;cursor:pointer;border-radius:1px;">
      入館する
    </button>
  </div>
</div>

<script>
function checkPw(){
  const val = document.getElementById('pw-input').value;
  const hash = val.split('').reduce((a,c)=>((a<<5)-a+c.charCodeAt(0))|0,0);
  if(hash === -2078434992){
    document.getElementById('pw-overlay').style.display='none';
    sessionStorage.setItem('mlb_admin_auth','1');
  } else {
    document.getElementById('pw-error').style.display='block';
    document.getElementById('pw-input').value='';
    document.getElementById('pw-input').focus();
  }
}
// セッション中は認証済みならスキップ
if(sessionStorage.getItem('mlb_admin_auth')==='1'){
  document.addEventListener('DOMContentLoaded',()=>{
    document.getElementById('pw-overlay').style.display='none';
  });
}
</script>

async function sbFetch(path,opts){
  opts=opts||{};
  const res=await fetch(SB_URL+'/rest/v1/'+path,{
    headers:Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Content-Type':'application/json','Prefer':'return=representation'},opts.headers||{}),
    method:opts.method||'GET',body:opts.body||undefined
  });
  if(!res.ok){console.error('SB',res.status,await res.text());return null;}
  const txt=await res.text();return txt?JSON.parse(txt):null;
}
const sbGet=(t,q)=>sbFetch(t+(q?'?'+q:''));
const sbPost=(t,d)=>sbFetch(t,{method:'POST',body:JSON.stringify(d)});
const sbPatch=(t,q,d)=>sbFetch(t+(q?'?'+q:''),{method:'PATCH',body:JSON.stringify(d)});
const sbDelete=(t,q)=>sbFetch(t+(q?'?'+q:''),{method:'DELETE'});

async function saveWork(){
  const title=document.getElementById('w-title').value.trim();
  if(!title){alert('作品名を入力してください');return;}
  const floor=document.getElementById('w-floor').value;
  const manualAccNo=document.getElementById('w-accno').value.trim();
  if(editingWorkId){
    const updates={title,floor,
      author:document.getElementById('w-author').value.trim()||'匿名',
      hall:document.getElementById('w-hall').value,
      description:document.getElementById('w-desc').value.trim(),
      cause:document.getElementById('w-cause').value.trim(),
      lesson:document.getElementById('w-lesson').value.trim(),
      comment:document.getElementById('w-comment').value.trim(),
      danger:parseInt(document.getElementById('w-danger').value),
      published:document.getElementById('w-pub').value==='true'};
    if(manualAccNo)updates.acc_no=manualAccNo;
    if(adminImgData)updates.image=adminImgData;
    await sbPatch('works','id=eq.'+editingWorkId,updates);
    alert('作品「'+title+'」を更新しました');
  } else {
    const accNo=manualAccNo||'MHL-'+String(_works.filter(w=>w.floor===floor).length+1).padStart(4,'0')+'-'+floor.toUpperCase().slice(0,1);
    const id='w_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    const work={id,floor,acc_no:accNo,hall:floor,title,
      author:document.getElementById('w-author').value.trim()||'匿名',
      description:document.getElementById('w-desc').value.trim(),
      cause:document.getElementById('w-cause').value.trim(),
      lesson:document.getElementById('w-lesson').value.trim(),
      comment:document.getElementById('w-comment').value.trim(),
      danger:parseInt(document.getElementById('w-danger').value),
      video_url:document.getElementById('w-video')?.value.trim()||'',
      audio_url:document.getElementById('w-audio')?.value.trim()||'',
      image:adminImgData||'',
      published:document.getElementById('w-pub').value==='true',
      created_at:Date.now(),status:'exhibited',history:[],cert_issued:false};
    const result=await sbPost('works',work);
    if(!result){alert('追加に失敗しました');return;}
    alert('作品「'+title+'」を追加しました（'+accNo+'）');
  }
  cancelEdit();
  await loadAdminData();
  renderWorksList();
}

function editWork(id){
  const w=_works.find(x=>x.id===id);if(!w)return;
  editingWorkId=id;
  document.getElementById('w-accno').value=w.acc_no||'';
  document.getElementById('w-title').value=w.title||'';
  document.getElementById('w-author').value=w.author||'';
  document.getElementById('w-floor').value=w.floor||'fail';
  syncHallOptions();
  setTimeout(()=>{document.getElementById('w-hall').value=w.hall||'';},50);
  document.getElementById('w-desc').value=w.description||'';
  document.getElementById('w-cause').value=w.cause||'';
  document.getElementById('w-lesson').value=w.lesson||'';
  document.getElementById('w-comment').value=w.comment||'';
  document.getElementById('w-danger').value=w.danger||3;
  document.getElementById('w-pub').value=w.published?'true':'false';
  if(w.image){const prev=document.getElementById('w-img-prev');prev.src=w.image;prev.style.display='block';adminImgData=w.image;}
  document.getElementById('work-form-title').textContent='作品を編集中';
  document.getElementById('work-submit-btn').textContent='変更を保存する';
  document.getElementById('work-cancel-btn').style.display='block';
  document.getElementById('work-form-title').scrollIntoView({behavior:'smooth'});
}

function openMig(id){
  const w=(load(K.works)||[]).find(x=>x.id===id);if(!w)return;
  migWorkId=id;
  document.getElementById('mig-work-name').textContent='「'+w.title+'」の移動先を選択';
  const floors=['fail','unfinish','success'].filter(f=>f!==w.floor);
  document.getElementById('mig-opts').innerHTML=floors.map(f=>`
    <button class="mig-opt" onclick="migrateWork('${f}')">
      <span style="color:${FLOOR_COLORS[f]}">${FLOOR_LABELS[f]}</span>へ移動
    </button>`).join('');
  document.getElementById('mig-overlay').classList.add('show');
}
function migrateWork(toFloor){
  if(!migWorkId)return;
  const works=load(K.works)||[];
  const w=works.find(x=>x.id===migWorkId);if(!w)return;
  const fromLabel=FLOOR_LABELS[w.floor]||w.floor;
  const toLabel=FLOOR_LABELS[toFloor];
  if(!w.history)w.history=[];
  w.history.push({from:fromLabel,to:toLabel,date:new Date().toLocaleDateString('ja-JP')});
  w.migratedFrom=w.floor;
  w.floor=toFloor;
  // update hall to match new floor
  const defaultHalls={fail:'第一展示館（転び方図鑑）',unfinish:'未完成・その他',success:'成功・その他'};
  w.hall=defaultHalls[toFloor];
  save(K.works,works);
  closeMigDirect();
  renderWorksList();
  alert(`「${w.title}」を${toLabel}へ移動しました`);
}
function closeMig(e){if(e.target===document.getElementById('mig-overlay'))closeMigDirect();}

async function approveSub(idx){
  const s=_subs[idx];if(!s)return;
  const comment=prompt('学芸員コメントを入力してください（省略可）')||'';
  const accNo='MHL-'+String(_works.length+1).padStart(4,'0')+'-'+s.floor.toUpperCase().slice(0,1);
  const work={id:s.id,floor:s.floor,acc_no:accNo,title:s.title,author:s.author,
    hall:s.hall,description:s.description,cause:s.cause,lesson:s.lesson,
    comment:comment,image:s.image,published:true,status:'exhibited',
    history:[],cert_issued:false,created_at:s.created_at||Date.now()};
  await sbPost('works',work);
  await sbPatch('submissions','id=eq.'+s.id,{status:'exhibited',comment:comment,acc_no:accNo});
  await loadAdminData();
  renderSubs();
  alert('「'+s.title+'」を収蔵決定しました（'+accNo+'）\n証明書タブから発行できます。');
}

  await sbDelete('submissions','id=eq.'+s.id);
  await loadAdminData();renderSubs();
}

      ${w.acc_no||'---'} ${w.title||'無題'}
    </label>`).join(''):'<div style="color:var(--muted);font-size:11px">この館に公開作品がありません</div>';
  if(sp.title)document.getElementById('sp-title').value=sp.title;
  if(sp.subtitle)document.getElementById('sp-sub').value=sp.subtitle||'';
  if(sp.startDate)document.getElementById('sp-start').value=sp.startDate;
  if(sp.endDate)document.getElementById('sp-end').value=sp.endDate;
}
function limitSpecialCheck(){
  const checked=document.querySelectorAll('input[name="sp-work"]:checked');
  if(checked.length>5){event.target.checked=false;alert('最大5点まで選択できます');}
}
async function saveSpecial(){
  const floor=document.getElementById('sp-floor').value;
  const checked=[...document.querySelectorAll('input[name="sp-work"]:checked')].map(x=>x.value);
  const data={floor,title:document.getElementById('sp-title').value.trim(),
    subtitle:document.getElementById('sp-sub').value.trim(),
    start_date:document.getElementById('sp-start').value,
    end_date:document.getElementById('sp-end').value,work_ids:checked};
  await sbUpsert('special',data);alert('特別展を保存しました');
}
async function deleteSpecial(){
  const floor=document.getElementById('sp-floor').value;
  await sbDelete('special','floor=eq.'+floor);
  alert('特別展を削除しました');
}

// ── KANCHO ──
async function saveKancho(){
  const target=document.getElementById('kancho-target').value;
  const data={target,date:document.getElementById('kancho-date').value,body:document.getElementById('kancho-text').value.trim()};
  await sbUpsert('kancho',data);alert('館長だよりを保存しました');
}

// ── CERTIFICATE ──
function renderCertSelect(){
  const works=_works||[];
  const sel=document.getElementById('cert-work-sel');
  sel.innerHTML='<option value="">-- 作品を選んでください --</option>'+
    works.filter(w=>w.published).map(w=>'<option value="'+w.id+'">['+FLOOR_LABELS[w.floor]+'] '+(w.acc_no||'No.未設定')+' '+(w.title||'無題')+'</option>').join('');
}

function openCertFor(id){
  showTab('cert');
  setTimeout(()=>{
    document.getElementById('cert-work-sel').value=id;
    renderCertPreview();
  },100);
}
function renderCertPreview(){
  const id=document.getElementById('cert-work-sel').value;
  const el=document.getElementById('cert-preview-area');
  if(!id){el.innerHTML='';return;}
  const w=(_works||[]).find(x=>x.id===id);if(!w)return;
  el.innerHTML='<div style="background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:2px;padding:14px;font-size:12px;color:var(--muted);line-height:1.8;">'+
    '<div style="color:var(--gold);font-size:10px;letter-spacing:.2em;margin-bottom:8px;">証明書プレビュー</div>'+
    '<b>'+(w.title||'無題')+'</b>　'+(w.author||'匿名')+'<br>'+
    FLOOR_LABELS[w.floor||'fail']+'｜'+(w.hall||'—')+'<br>収蔵番号：'+(w.acc_no||'—')+'</div>';
}

function issueCert(){
  const id=document.getElementById('cert-work-sel').value;
  if(!id){alert('作品を選択してください');return;}
  const w=(_works||[]).find(x=>x.id===id);
  if(!w){alert('作品を選択してください');return;}
  const dateStr=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});
  const reiwa=new Date().getFullYear()-2018;
  const reiwaStr='令和'+reiwa+'年'+(new Date().getMonth()+1)+'月'+new Date().getDate()+'日';
  const FLOOR_LABELS_CERT={fail:'失敗館',unfinish:'未完成館',success:'成功館'};
  let certHtml=getCertTemplate();
  certHtml=certHtml.replace('id="cert-no-display">—','id="cert-no-display">'+(w.acc_no||'—'));
  certHtml=certHtml.replace('id="cert-title-display">—','id="cert-title-display">'+(w.title||'無題'));
  certHtml=certHtml.replace('id="cert-author-display">—','id="cert-author-display">'+(w.author||'匿名'));
  certHtml=certHtml.replace('id="cert-floor-display">—','id="cert-floor-display">'+(FLOOR_LABELS_CERT[w.floor]||w.floor));
  certHtml=certHtml.replace('id="cert-hall-display">—','id="cert-hall-display">'+(w.hall||'—'));
  certHtml=certHtml.replace('id="cert-accno-display">—','id="cert-accno-display">'+(w.acc_no||'—'));
  certHtml=certHtml.replace('id="cert-date-display">—','id="cert-date-display">'+dateStr);
  certHtml=certHtml.replace('発行日：令和　年　月　日','発行日：'+reiwaStr);
  const kanchoName=load('mlb_kancho_name')||'';
  certHtml=certHtml.replace('館　長　之　印', kanchoName ? '館長　'+kanchoName : '');
  const workUrl='https://jinsei-hakubutsukan.netlify.app';
  certHtml=certHtml.replace('id="cert-qr-canvas"','id="cert-qr-canvas" data-url="'+workUrl+'"');
    const printHtml=certHtml; blob=new Blob([printHtml],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='cert_'+(w.acc_no||'draft')+'.html';a.click();
  sbPatch('works','id=eq.'+id,{cert_issued:true});
}

function loadSettings(){
  const ov=load(K.open)||'';
  document.getElementById('open-override').value=ov;
  const kn=load('mlb_kancho_name')||'';
  document.getElementById('kancho-name').value=kn;
}
function saveKanchoName(){
  const name=document.getElementById('kancho-name').value.trim();
  save('mlb_kancho_name',name);
  alert('館長名を保存しました');
}
function saveOpenOverride(){
  save(K.open,document.getElementById('open-override').value);
  alert('保存しました');
}
async function exportData(){
  const [works,subs,special,kancho]=await Promise.all([sbGet('works'),sbGet('submissions'),sbGet('special'),sbGet('kancho')]);
  const data={works,subs,special,kancho};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='museum_export_'+Date.now()+'.json';a.click();
}
function importData(){document.getElementById('import-file').click();}
function doImport(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.works)save(K.works,d.works);
      if(d.subs)save(K.subs,d.subs);
      if(d.special)save(K.special,d.special);
      if(d.kancho)save(K.kancho,d.kancho);
      alert('インポートしました');location.reload();
    }catch(err){alert('JSONの解析に失敗しました');}
  };
  r.readAsText(f);
}
async function resetAll(){
  if(!confirm('全データを削除しますか？この操作は取り消せません。'))return;
  await Promise.all([sbDelete('works','id=neq.x'),sbDelete('submissions','id=neq.x'),sbDelete('special','floor=neq.x'),sbDelete('kancho','target=neq.x'),sbDelete('empathy','work_id=neq.x'),sbDelete('visitors','work_id=neq.x')]);
  localStorage.removeItem(K.open);
  await loadAdminData();renderSubs();
  alert('リセットしました');
}

// ── INIT ──
loadAdminData().then(()=>{renderSubs();});
</script>
